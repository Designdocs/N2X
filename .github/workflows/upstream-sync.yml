name: Upstream Sync

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 Asia/Shanghai
  workflow_dispatch: {}

env:
  GOWORK: "off"
  GOEXPERIMENT: jsonv2

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Apply reviewed module pins
        run: python3 .github/scripts/sync-upstreams.py --apply

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go test -mod=readonly -p 1 -tags "sing xray with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" ./...

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/upstream-sync
          delete-branch: true
          title: "chore: upstream sync"
          commit-message: "chore: upstream sync"
          body: |
            Apply the exact reviewed module versions recorded in `UPSTREAMS.json`.
            Core updates require merging upstream changes into the N2X forks first.
            The workflow verifies fork replacements and the complete production build tags.
          labels: |
            dependencies
