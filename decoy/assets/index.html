<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service status</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="service-shell">
    <section class="service-panel" aria-labelledby="service-title">
      <header class="service-header">
        <p class="service-label">System status</p>
        <h1 id="service-title">Service status</h1>
      </header>
      <p class="service-message">The requested service is available.</p>
      <footer class="service-footer">
        <span class="status-indicator" aria-hidden="true"></span>
        <span>Operational</span>
      </footer>
    </section>
  </main>
</body>
</html>
